name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://salaryplanner:salaryplanner@localhost:5432/salaryplanner?schema=public"
      AUTH_SECRET: "ci-only-secret-not-used-in-production"
      AUTH_URL: "http://localhost:3000"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: salaryplanner
          POSTGRES_PASSWORD: salaryplanner
          POSTGRES_DB: salaryplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salaryplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Apply migrations
        run: pnpm db:migrate:deploy

      - name: Seed payroll configuration
        run: pnpm db:seed

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e
